<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PubSub Live Dashboard</title>
    
    <!-- Fonts: Inter (UI) & Fira Code (Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons: Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Local CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="header-left">
            <div class="logo-icon"><i class="ph-fill ph-activity"></i></div>
            <h1>PubSub Middleware</h1>
        </div>
        <div class="connection-status">
            <span id="socket-status-dot" class="status-dot offline"></span>
            <span id="socket-status-text">Disconnected</span>
        </div>
    </header>

    <main class="dashboard-grid">
        <!-- TOP LEFT: Live Price Charts -->
        <section class="panel panel-charts">
            <div class="panel-header">
                <i class="ph ph-chart-line-up"></i> Live Price Charts
            </div>
            <div class="charts-grid">
                <div class="chart-container"><canvas id="chart-AAPL"></canvas></div>
                <div class="chart-container"><canvas id="chart-TSLA"></canvas></div>
                <div class="chart-container"><canvas id="chart-GOOGL"></canvas></div>
                <div class="chart-container"><canvas id="chart-AMZN"></canvas></div>
            </div>
        </section>

        <!-- TOP RIGHT: Broker Status -->
        <section class="panel panel-status">
            <div class="panel-header">
                <i class="ph ph-cpu"></i> Broker Status
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="ph ph-users-three stat-icon"></i>
                    <div class="stat-value" id="stat-clients">0</div>
                    <div class="stat-label">Connected Clients</div>
                </div>
                <div class="stat-card">
                    <i class="ph ph-hash stat-icon"></i>
                    <div class="stat-value" id="stat-topics">0</div>
                    <div class="stat-label">Active Topics</div>
                </div>
                <div class="stat-card">
                    <i class="ph ph-paper-plane-tilt stat-icon"></i>
                    <div class="stat-value" id="stat-delivered">0</div>
                    <div class="stat-label">Messages Delivered</div>
                </div>
                <div class="stat-card">
                    <i class="ph ph-clock-counter-clockwise stat-icon"></i>
                    <div class="stat-value" id="stat-acks">0</div>
                    <div class="stat-label">Pending ACKs</div>
                </div>
            </div>
        </section>

        <!-- BOTTOM LEFT: Message Feed -->
        <section class="panel panel-feed">
            <div class="panel-header">
                <i class="ph ph-terminal-window"></i> Live Message Feed
            </div>
            <div class="feed-container">
                <ul id="message-list" class="scrolling-list">
                    <!-- Messages injected here via JS -->
                </ul>
            </div>
        </section>

        <!-- BOTTOM RIGHT: Alert Log -->
        <section class="panel panel-alerts">
            <div class="panel-header">
                <i class="ph ph-warning-circle"></i> System Alerts
            </div>
            <div class="alerts-container">
                <ul id="alert-list" class="scrolling-list">
                    <!-- Alerts injected here via JS -->
                </ul>
            </div>
        </section>
    </main>

    <!-- Local JavaScript -->
    <script src="/static/js/charts.js"></script>
    <script src="/static/js/alerts.js"></script>
    <script src="/static/js/socket.js"></script>
</body>
</html>
